<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>游戏作者端 · 上帝控制台</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; -webkit-tap-highlight-color:transparent; }
body { background:#000; color:#fff; height:100vh; height:100dvh; display:flex; overflow:hidden; }
#gateScreen { position:fixed; inset:0; background:#0a0a0f; display:flex; justify-content:center; align-items:center; padding:20px; z-index:99999; overflow-y:auto; }
#gateScreen .box { background:rgba(30,30,30,0.8); backdrop-filter:blur(30px); border:1px solid rgba(255,255,255,0.15); padding:36px 28px; border-radius:24px; width:85%; max-width:340px; }
#gateScreen h1 { color:#ffd700; text-align:center; margin-bottom:20px; font-size:22px; }
#gateScreen input { width:100%; padding:14px; border:1px solid rgba(255,255,255,0.15); border-radius:12px; background:rgba(0,0,0,0.5); color:#fff; outline:none; font-size:16px; margin-bottom:12px; }
#gateScreen button { width:100%; padding:15px; border:none; border-radius:12px; background:linear-gradient(135deg,#ffd700,#ff8c00); color:#000; font-weight:800; font-size:16px; cursor:pointer; }
#gateScreen .err { color:#ff3b30; text-align:center; font-size:13px; margin-top:10px; min-height:20px; white-space:pre-wrap; }
#app { display:none; flex:1; }
.sidebar { width:34%; max-width:340px; min-width:110px; background:rgba(20,20,20,0.7); backdrop-filter:blur(20px); border-right:1px solid rgba(255,255,255,0.1); display:flex; flex-direction:column; }
.sidebar-header { padding:14px; border-bottom:1px solid rgba(255,255,255,0.1); font-size:14px; font-weight:800; color:#ffd700; text-align:center; }
#playerList { flex:1; overflow-y:auto; padding:8px; -webkit-overflow-scrolling:touch; }
.player-item { padding:10px; margin-bottom:6px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); border-radius:10px; cursor:pointer; }
.player-item:active { background:rgba(255,255,255,0.12); }
.main-area { flex:1; overflow-y:auto; padding:14px; background:rgba(10,10,10,0.6); -webkit-overflow-scrolling:touch; }
.card { background:rgba(30,30,30,0.6); border:1px solid rgba(255,255,255,0.1); border-radius:14px; padding:14px; margin-bottom:12px; }
.card-title { font-size:14px; font-weight:800; color:#00c6ff; margin-bottom:10px; }
.btn { width:100%; padding:12px; border:none; border-radius:10px; font-weight:700; font-size:14px; cursor:pointer; background:rgba(0,198,255,0.15); color:#00c6ff; border:1px solid rgba(0,198,255,0.3); margin-bottom:8px; }
.btn-red { background:rgba(255,59,48,0.15); color:#ff453a; border-color:rgba(255,59,48,0.3); }
.btn-green { background:rgba(52,199,89,0.15); color:#30d158; border-color:rgba(52,199,89,0.3); }
.btn-gold { background:rgba(255,215,0,0.15); color:#ffd700; border-color:rgba(255,215,0,0.3); }
.btn-purple { background:rgba(156,39,176,0.15); color:#ce93d8; border-color:rgba(156,39,176,0.3); }
.btn-jade { background:rgba(0,229,255,0.15); color:#00e5ff; border-color:rgba(0,229,255,0.3); }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.debug { position:fixed; bottom:8px; left:8px; right:8px; background:rgba(0,0,0,0.9); color:#0f0; font-size:11px; padding:6px 10px; border-radius:8px; z-index:999999; display:none; font-family:monospace; }
</style>
</head>
<body>

<div id="gateScreen">
  <div class="box">
    <h1>🎮 作者上帝端</h1>
    <input id="pwdInput" type="password" placeholder="作者密钥" autocomplete="off">
    <button id="gateBtn" type="button">进入</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div id="app">
  <div class="sidebar">
    <div class="sidebar-header">🎮 玩家列表</div>
    <div id="playerList"><div style="color:#666;text-align:center;padding:20px;font-size:12px;">加载中...</div></div>
  </div>
  <div class="main-area" id="playerDetail">
    <div style="text-align:center;color:#666;padding:50px;font-size:14px;">点击左侧玩家</div>
  </div>
</div>
<div class="debug" id="debugBox"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, get, set, update, push, onValue, remove }
  from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = { databaseURL: "https://class3b-5b39b-default-rtdb.asia-southeast1.firebasedatabase.app" };
const AUTHOR_PWD = "f2519484";
const AUTH_KEY = "game_admin_auth_v2";
const MAX_SAFE = 1.7e308;

const QUALITY_NAMES = [
  '凡品','下品','中品','上品','极品','仙品','神品','至宝',
  '灵宝','玄宝','天宝','圣宝','道宝','尊宝','王宝','皇宝','帝宝','君宝','仙宝','神宝','圣尊宝','道尊宝','天主宝','圣天主宝','道天主宝','混沌至宝','鸿蒙至宝'
];
const PART_NAMES = { weapon:'武器', helmet:'头盔', armor:'护甲', boots:'靴子', ring:'戒指', necklace:'项链', belt:'腰带', artifact:'法宝' };
const PART_KEYS = ['weapon','helmet','armor','boots','ring','necklace','belt','artifact'];

const REALM_NAMES = [
  '炼气','筑基','金丹','元婴','化神','炼虚','合体','大乘','渡劫','真仙',
  '玄仙','地仙','天仙','金仙','大罗金仙','混元大罗金仙','准圣','圣人','天道圣人','大道圣人','鸿蒙圣人','造化圣人','混元圣人','无极圣人','太上圣人','混沌圣人','鸿蒙主宰','大道主宰','无极大道'
];

const PET_NAMES = ['灵狐','火麒麟','九尾狐'];
const SPIRIT_NAMES = ['树精','石灵','剑灵'];
const SPELL_DEFS = [
  { id:'sword', name:'御剑术' }, { id:'flame', name:'烈焰诀' }, { id:'ice', name:'寒冰咒' },
  { id:'shield', name:'金刚罩' }, { id:'wind', name:'疾风步' }, { id:'heal', name:'回春术' }
];

let db = null;
let allPlayers = {};
let selectedPlayer = null;

function safeNum(v, fallback) {
  if (typeof v !== 'number' || !isFinite(v) || isNaN(v)) return fallback || 0;
  return v;
}
function safeClampInf(v) {
  if (typeof v !== 'number' || isNaN(v)) return 0;
  if (v === Infinity) return MAX_SAFE;
  if (v === -Infinity) return 0;
  return v;
}
function fmt(v) {
  v = safeNum(v, 0);
  const abs = Math.abs(v);
  if (abs < 10000) return Math.floor(v).toString();
  if (abs < 1e8) return (v/1e4).toFixed(2) + '万';
  if (abs < 1e12) return (v/1e8).toFixed(2) + '亿';
  if (abs < 1e16) return (v/1e12).toFixed(2) + '万亿';
  if (abs < 1e20) return (v/1e16).toFixed(2) + '京';
  return v.toExponential(2);
}

function debug(msg) {
  const box = document.getElementById('debugBox');
  if (box) { box.style.display = 'block'; box.innerText = msg; }
  console.log('[Admin]', msg);
}
function errShow(msg) {
  const e = document.getElementById('gateErr');
  if (e) e.innerText = msg;
  debug('ERR: ' + msg);
}
function escapeHtml(s) {
  if (s === undefined || s === null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatTime(ms) {
  if (ms <= 0) return '0秒';
  const s = Math.ceil(ms/1000);
  if (s < 60) return s + '秒';
  const m = Math.floor(s/60);
  if (m < 60) return m + '分' + (s%60) + '秒';
  return Math.floor(m/60) + '时' + (m%60) + '分';
}

window.addEventListener('error', e => errShow('脚本错误: ' + (e.message || '未知')));
window.addEventListener('unhandledrejection', e => errShow('异步错误: ' + (e.reason?.message || e.reason || '未知')));

function boot() {
  debug('boot start');
  const btn = document.getElementById('gateBtn');
  const input = document.getElementById('pwdInput');
  if (!btn || !input) { debug('DOM 缺失'); return; }
  btn.onclick = function() { tryLogin(); };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
  if (localStorage.getItem(AUTH_KEY) === 'ok') { debug('已登录，自动进入'); enterAdmin(); }
  else debug('等待输入密钥');
}

function tryLogin() {
  try {
    const input = document.getElementById('pwdInput');
    const pwd = input ? input.value : '';
    debug('点击进入，输入长度=' + pwd.length);
    if (pwd !== AUTHOR_PWD) { errShow('密钥错误'); return; }
    localStorage.setItem(AUTH_KEY, 'ok');
    debug('密钥正确');
    enterAdmin();
  } catch (e) { errShow('登录异常: ' + e.message); }
}

function enterAdmin() {
  try {
    debug('enterAdmin 切换UI');
    const gate = document.getElementById('gateScreen');
    const appEl = document.getElementById('app');
    if (gate) gate.style.display = 'none';
    if (appEl) appEl.style.display = 'flex';

    if (!db) {
      debug('初始化 Firebase');
      const app2 = initializeApp(firebaseConfig);
      db = getDatabase(app2);
    }
    debug('监听 game_players');
    onValue(ref(db, 'game_players'), (snap) => {
      debug('收到数据，玩家数=' + (snap.exists() ? Object.keys(snap.val()).length : 0));
      allPlayers = snap.exists() ? snap.val() : {};
      renderPlayerList();
      if (selectedPlayer && allPlayers[selectedPlayer]) {
        renderPlayerDetail(selectedPlayer, allPlayers[selectedPlayer]);
      }
    }, (error) => {
      debug('监听失败: ' + error.message);
      errShow('读取失败: ' + error.message + '\n请检查 Firebase 读写规则');
      if (gate) gate.style.display = 'flex';
      if (appEl) appEl.style.display = 'none';
    });
  } catch (e) { errShow('进入失败: ' + e.message); }
}

function renderPlayerList() {
  const el = document.getElementById('playerList');
  if (!el) return;
  el.innerHTML = '';
  const ids = Object.keys(allPlayers);
  if (ids.length === 0) {
    el.innerHTML = '<div style="color:#666;text-align:center;padding:20px;font-size:12px;">暂无玩家</div>';
    return;
  }
  ids.sort((a,b) => (safeNum(allPlayers[b].lastActive,0)) - (safeNum(allPlayers[a].lastActive,0)));
  ids.forEach(id => {
    const p = allPlayers[id];
    const div = document.createElement('div');
    div.className = 'player-item';
    if (id === selectedPlayer) div.style.background = 'rgba(255,215,0,0.15)';
    const online = (Date.now() - safeNum(p.lastActive,0)) < 60000;
    div.innerHTML = `
      <div style="font-weight:bold;color:#fff;font-size:13px;">${online?'🟢':'⚪'} ${escapeHtml(p.name||'无名')}</div>
      <div style="font-size:11px;color:#888;margin-top:3px;">${REALM_NAMES[safeNum(p.realm,0)]||'炼气'} ${safeNum(p.realmLevel,1)}层 · Lv.${fmt(p.charLevel)}</div>`;
    div.onclick = () => { selectedPlayer = id; renderPlayerList(); renderPlayerDetail(id, p); };
    el.appendChild(div);
  });
}

function renderPlayerDetail(id, p) {
  const el = document.getElementById('playerDetail');
  if (!el) return;
  const online = (Date.now() - safeNum(p.lastActive,0)) < 60000;

  const spellsHtml = SPELL_DEFS.map(sp => {
    const d = (p.spells && p.spells[sp.id]) || { level: 1, upgradeEnd: 0 };
    const isUp = d.upgradeEnd > Date.now();
    return `<div style="padding:8px;background:rgba(255,255,255,0.04);border-radius:8px;margin-bottom:6px;font-size:12px;">
      <div><b style="color:#ffd700;">${sp.name}</b> Lv.${fmt(d.level)} ${isUp?`<span style="color:#00c6ff;">(升级中 ${formatTime(d.upgradeEnd-Date.now())})</span>`:''}</div>
      <div style="display:flex;gap:6px;margin-top:6px;">
        <button class="btn" style="margin:0;padding:6px;font-size:11px;" onclick="setSpellLevel('${id}','${sp.id}')">设等级</button>
        ${isUp ? `<button class="btn btn-gold" style="margin:0;padding:6px;font-size:11px;" onclick="speedupSpell('${id}','${sp.id}')">加速</button>` : ''}
      </div>
    </div>`;
  }).join('');

  const eqHtml = PART_KEYS.map(part => {
    const eq = p.equipment && p.equipment[part];
    if (!eq) return `<div style="padding:6px;background:rgba(255,255,255,0.03);border-radius:6px;font-size:11px;color:#666;">${PART_NAMES[part]}: 空</div>`;
    return `<div style="padding:6px;background:rgba(255,255,255,0.03);border-radius:6px;font-size:11px;">
      <div><b style="color:#ffd700;">${PART_NAMES[part]}</b> ${QUALITY_NAMES[eq.quality]||'未知'} ${eq.enhance?'+'+fmt(eq.enhance):''}</div>
      <div style="color:#aaa;">攻${fmt(eq.atk)} 血${fmt(eq.hp)}</div>
      <div style="display:flex;gap:4px;margin-top:4px;">
        <button class="btn btn-gold" style="margin:0;padding:4px;font-size:10px;flex:1;" onclick="setEquipEnhance('${id}','${part}')">改强化</button>
        <button class="btn btn-purple" style="margin:0;padding:4px;font-size:10px;flex:1;" onclick="setEquipStats('${id}','${part}')">改属性</button>
      </div>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="card">
      <div style="font-size:16px;font-weight:800;color:#ffd700;margin-bottom:8px;">${escapeHtml(p.name||'无名')} ${online?'🟢':'⚪'}</div>
      <div style="font-size:12px;color:#aaa;line-height:1.8;">
        ID：${id}<br>
        Lv.${fmt(p.charLevel)} · 经验 ${fmt(p.exp)}<br>
        境界 ${REALM_NAMES[safeNum(p.realm,0)]||'炼气'} ${safeNum(p.realmLevel,1)}层<br>
        仙树 Lv.${fmt(p.treeLevel)} ${(p.treeUpgradeEnd>Date.now())?`(培育中 ${formatTime(p.treeUpgradeEnd-Date.now())})`:''}<br>
        💎 仙玉 ${fmt(p.jade)} · 🍑 仙桃 ${fmt(p.peaches)}<br>
        攻${fmt(p.atk)} 血${fmt(p.hp)}<br>
        妖王 ${safeNum(p.demonKingLevel,0)}/10 · 塔 ${safeNum(p.towerLevel,0)}/50
      </div>
      ${(p.treeUpgradeEnd > Date.now()) ? `<button class="btn btn-gold" style="margin-top:8px;" onclick="speedupTree('${id}')">⚡ 加速仙树</button>` : ''}
    </div>

    <div class="card">
      <div class="card-title">📦 发放物品</div>
      <button class="btn btn-jade" onclick="sendJade('${id}')">💎 发放仙玉</button>
      <button class="btn" onclick="sendPeaches('${id}')">🍑 发放仙桃</button>
      <button class="btn" onclick="sendExp('${id}')">⭐ 发放经验</button>
      <button class="btn" onclick="sendEquipment('${id}')">⚔️ 发放装备</button>
      <button class="btn" onclick="sendPet('${id}')">🐾 发放灵兽</button>
      <button class="btn" onclick="sendSpirit('${id}')">👻 发放精怪</button>
    </div>

    <div class="card">
      <div class="card-title">🔧 修改数值</div>
      <div class="grid2">
        <button class="btn" onclick="setCharLevel('${id}')">改等级</button>
        <button class="btn" onclick="setExp('${id}')">改经验</button>
        <button class="btn" onclick="setTreeLevel('${id}')">改仙树等级</button>
        <button class="btn" onclick="setJade('${id}')">改仙玉</button>
        <button class="btn" onclick="setPeaches('${id}')">改仙桃</button>
        <button class="btn" onclick="setRealm('${id}')">改境界</button>
        <button class="btn" onclick="setAtk('${id}')">改攻击</button>
        <button class="btn" onclick="setHp('${id}')">改气血</button>
        <button class="btn" onclick="setLuck('${id}')">改幸运</button>
        <button class="btn" onclick="setCritRate('${id}')">改暴击率</button>
        <button class="btn" onclick="setCritDmg('${id}')">改暴伤</button>
        <button class="btn" onclick="setDemon('${id}')">改妖王进度</button>
        <button class="btn" onclick="setTower('${id}')">改塔进度</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">⚔️ 已穿戴装备</div>
      <div style="display:grid;gap:6px;">${eqHtml}</div>
    </div>

    <div class="card">
      <div class="card-title">📖 仙术管理</div>
      ${spellsHtml}
    </div>

    <div class="card">
      <div class="card-title">🔨 玩家管理</div>
      <button class="btn btn-red" onclick="banPlayer('${id}')">🚫 封禁</button>
      <button class="btn btn-green" onclick="unbanPlayer('${id}')">✅ 解封</button>
      <button class="btn btn-red" onclick="deletePlayer('${id}')">☢️ 删除存档</button>
    </div>
  `;
}

function parseAuthorInput(str, def) {
  if (str === null || str === undefined) return null;
  str = String(str).trim();
  if (str === '') return null;
  let mult = 1;
  if (str.endsWith('万')) { mult = 1e4; str = str.slice(0, -1); }
  else if (str.endsWith('亿')) { mult = 1e8; str = str.slice(0, -1); }
  else if (str.endsWith('万亿')) { mult = 1e12; str = str.slice(0, -2); }
  else if (str.endsWith('京')) { mult = 1e16; str = str.slice(0, -1); }
  const v = parseFloat(str);
  if (isNaN(v)) return null;
  const r = v * mult;
  if (!isFinite(r)) return MAX_SAFE;
  return r;
}

window.sendJade = (id) => {
  const n = prompt('发放仙玉（支持万/亿单位）：', '10');
  if (n === null) return;
  const v = parseAuthorInput(n);
  if (v === null) return alert('数值无效');
  push(ref(db, 'game_players/'+id+'/inbox'), { type:'jade', payload:{amount:v}, time:Date.now(), claimed:false })
    .then(()=>alert('已发放 ' + fmt(v))).catch(e=>alert('失败:'+e.message));
};
window.sendPeaches = (id) => {
  const n = prompt('发放仙桃：', '1000');
  if (n === null) return;
  const v = parseAuthorInput(n);
  if (v === null) return alert('数值无效');
  push(ref(db, 'game_players/'+id+'/inbox'), { type:'peaches', payload:{amount:v}, time:Date.now(), claimed:false })
    .then(()=>alert('已发放 ' + fmt(v))).catch(e=>alert('失败:'+e.message));
};
window.sendExp = (id) => {
  const n = prompt('发放经验：', '1000');
  if (n === null) return;
  const v = parseAuthorInput(n);
  if (v === null) return alert('数值无效');
  push(ref(db, 'game_players/'+id+'/inbox'), { type:'exp', payload:{amount:v}, time:Date.now(), claimed:false })
    .then(()=>alert('已发放 ' + fmt(v))).catch(e=>alert('失败:'+e.message));
};
  
window.sendEquipment = (id) => {
  const part = prompt('部位（weapon/helmet/armor/boots/ring/necklace/belt/artifact）：','weapon');
  if (!PART_KEYS.includes(part)) return alert('部位错误');
  const q = parseInt(prompt('品质 0-26：','5'));
  if (isNaN(q) || q < 0 || q > 26) return alert('品质错误，范围0-26');
  const enhStr = prompt('强化等级：','0');
  const enh = parseAuthorInput(enhStr, 0);
  const atkStr = prompt('攻击（留空按品质自动）：', '');
  const hpStr = prompt('气血（留空按品质自动）：', '');
  
  // 动态倍率（从客户端统一，这里简单映射）
  const multArray = [1,1.5,2.2,3.5,5.5,9,15,25,40,60,90,130,180,250,350,500,700,1000,1500,2200,3500,5500,9000,15000,25000,40000,70000];
  const base = 50 * (multArray[q] || 1);
  
  const atkVal = atkStr === '' ? Math.round(base*1.2) : parseAuthorInput(atkStr);
  const hpVal = hpStr === '' ? Math.round(base*2) : parseAuthorInput(hpStr);
  if (atkVal === null || hpVal === null) return alert('数值无效');
  push(ref(db, 'game_players/'+id+'/inbox'), {
    type:'equipment',
    payload:{ equipment:{ id:'EQ-AUTH-'+Date.now(), part, quality:q, atk:atkVal, hp:hpVal, critRate:q>=4?0.05:0, critDmg:q>=4?0.5:0, enhance:safeNum(enh,0) } },
    time:Date.now(), claimed:false
  }).then(()=>alert('已发放')).catch(e=>alert('失败:'+e.message));
};
window.sendPet = (id) => {
  const i = parseInt(prompt('0=灵狐 1=火麒麟 2=九尾狐：','0'));
  if (isNaN(i)||i<0||i>2) return alert('编号错误');
  push(ref(db, 'game_players/'+id+'/inbox'), { type:'pet', payload:{petId:i}, time:Date.now(), claimed:false })
    .then(()=>alert('已发放')).catch(e=>alert('失败:'+e.message));
};
window.sendSpirit = (id) => {
  const i = parseInt(prompt('0=树精 1=石灵 2=剑灵：','0'));
  if (isNaN(i)||i<0||i>2) return alert('编号错误');
  push(ref(db, 'game_players/'+id+'/inbox'), { type:'spirit', payload:{spiritId:i}, time:Date.now(), claimed:false })
    .then(()=>alert('已发放')).catch(e=>alert('失败:'+e.message));
};

function askNum(label, def) {
  const s = prompt(label, def === undefined ? '0' : String(def));
  if (s === null) return null;
  const v = parseAuthorInput(s);
  if (v === null) { alert('数值无效'); return null; }
  return v;
}
window.setCharLevel = (id) => { const v=askNum('等级：',safeNum(allPlayers[id].charLevel,1)); if(v===null)return; update(ref(db,'game_players/'+id),{charLevel:Math.max(1,Math.round(v))}).then(()=>alert('已修改')); };
window.setExp = (id) => { const v=askNum('经验：',safeNum(allPlayers[id].exp,0)); if(v===null)return; update(ref(db,'game_players/'+id),{exp:Math.max(0,v)}).then(()=>alert('已修改')); };
window.setTreeLevel = (id) => { const v=askNum('仙树等级：',safeNum(allPlayers[id].treeLevel,1)); if(v===null)return; update(ref(db,'game_players/'+id),{treeLevel:Math.max(1,Math.round(v))}).then(()=>alert('已修改')); };
window.setJade = (id) => { const v=askNum('仙玉：',safeNum(allPlayers[id].jade,0)); if(v===null)return; update(ref(db,'game_players/'+id),{jade:Math.max(0,v)}).then(()=>alert('已修改')); };
window.setPeaches = (id) => { const v=askNum('仙桃：',safeNum(allPlayers[id].peaches,0)); if(v===null)return; update(ref(db,'game_players/'+id),{peaches:Math.max(0,v)}).then(()=>alert('已修改')); };
window.setRealm = (id) => {
  const r = askNum('境界 0-28：', safeNum(allPlayers[id].realm,0)); if(r===null)return;
  const lv = askNum('层数 1-9：', safeNum(allPlayers[id].realmLevel,1)); if(lv===null)return;
  update(ref(db,'game_players/'+id),{realm:Math.min(28,Math.max(0,Math.round(r))), realmLevel:Math.min(9,Math.max(1,Math.round(lv)))}).then(()=>alert('已修改'));
};
window.setAtk = (id) => { const v=askNum('攻击：',safeNum(allPlayers[id].atk,10)); if(v===null)return; update(ref(db,'game_players/'+id),{atk:Math.max(0,v)}).then(()=>alert('已修改')); };
window.setHp = (id) => { const v=askNum('气血：',safeNum(allPlayers[id].hp,100)); if(v===null)return; update(ref(db,'game_players/'+id),{hp:Math.max(0,v)}).then(()=>alert('已修改')); };
window.setLuck = (id) => { const v=askNum('幸运：',safeNum(allPlayers[id].luck,0)); if(v===null)return; update(ref(db,'game_players/'+id),{luck:Math.max(0,v)}).then(()=>alert('已修改')); };
window.setCritRate = (id) => { const v=askNum('暴击率 0-1：',safeNum(allPlayers[id].critRate,0.05)); if(v===null)return; update(ref(db,'game_players/'+id),{critRate:Math.min(1,Math.max(0,v))}).then(()=>alert('已修改')); };
window.setCritDmg = (id) => { const v=askNum('暴伤倍率：',safeNum(allPlayers[id].critDmg,1.5)); if(v===null)return; update(ref(db,'game_players/'+id),{critDmg:Math.max(1,v)}).then(()=>alert('已修改')); };
window.setDemon = (id) => { const v=askNum('妖王进度 0-10：',safeNum(allPlayers[id].demonKingLevel,0)); if(v===null)return; update(ref(db,'game_players/'+id),{demonKingLevel:Math.min(10,Math.max(0,Math.round(v)))}).then(()=>alert('已修改')); };
window.setTower = (id) => { const v=askNum('塔进度 0-50：',safeNum(allPlayers[id].towerLevel,0)); if(v===null)return; update(ref(db,'game_players/'+id),{towerLevel:Math.min(50,Math.max(0,Math.round(v)))}).then(()=>alert('已修改')); };

window.setEquipEnhance = (id, part) => {
  const v = askNum('强化等级：', 0); if(v===null)return;
  update(ref(db,'game_players/'+id+'/equipment/'+part),{enhance:Math.max(0,Math.round(v))}).then(()=>alert('已修改'));
};
window.setEquipStats = (id, part) => {
  const atk = askNum('攻击：', 0); if(atk===null)return;
  const hp = askNum('气血：', 0); if(hp===null)return;
  const q = askNum('品质 0-26：', 5); if(q===null)return;
  update(ref(db,'game_players/'+id+'/equipment/'+part),{atk:Math.max(0,atk),hp:Math.max(0,hp),quality:Math.min(26,Math.max(0,Math.round(q)))}).then(()=>alert('已修改'));
};

window.setSpellLevel = (id, spellId) => {
  const s = prompt('仙术等级（支持万/亿）：','1');
  if (s === null) return;
  const v = parseAuthorInput(s);
  if (v === null) return alert('数值无效');
  update(ref(db,'game_players/'+id+'/spells/'+spellId),{level:Math.max(1,Math.round(v)),upgradeEnd:0}).then(()=>alert('已修改'));
};
window.speedupSpell = (id, spellId) => {
  update(ref(db,'game_players/'+id+'/spells/'+spellId),{upgradeEnd:0}).then(()=>alert('已加速'));
};
window.speedupTree = (id) => {
  update(ref(db,'game_players/'+id),{treeUpgradeEnd:0}).then(()=>alert('已加速'));
};

window.banPlayer = (id) => {
  const reason = prompt('封禁原因：','违规');
  if (reason === null) return;
  set(ref(db,'game_config/banned_players/'+id),{reason,time:Date.now()}).then(()=>alert('已封禁')).catch(e=>alert('失败:'+e.message));
};
window.unbanPlayer = (id) => {
  remove(ref(db,'game_config/banned_players/'+id)).then(()=>alert('已解封')).catch(e=>alert('失败:'+e.message));
};
window.deletePlayer = (id) => {
  if (!confirm('确定删除该玩家全部存档？')) return;
  remove(ref(db,'game_players/'+id)).then(()=>{ selectedPlayer=null; document.getElementById('playerDetail').innerHTML=''; alert('已删除'); });
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
