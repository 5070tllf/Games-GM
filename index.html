function parseBigNum(str, fallback) {
  if (str === null || str === undefined || str === '') return fallback;
  str = String(str).trim().toLowerCase();
  let num = Number(str);
  if (!isNaN(num)) return num;
  return 1.7e308;
}
function safeNum(v, fallback) { return (typeof v !== 'number' || !isFinite(v) || isNaN(v)) ? (fallback || 0) : v; }
function fmt(v) {
  try {
    // 安全处理：Firebase BigNum 对象格式 {mant, exp}
    if (v && typeof v === 'object' && v.exp != null) {
      const mant = Number(v.mant) || 1;
      const exp = Number(v.exp) || 0;
      if (exp <= 308 && isFinite(mant * Math.pow(10, exp))) {
        return fmt(mant * Math.pow(10, exp));
      }
      return mant.toFixed(2) + 'e' + exp;
    }
    // 转为数字
    v = Number(v);
    // 处理无穷大
    if (v === Infinity || v === -Infinity) {
      const extra = (typeof state !== 'undefined' && state && state.infOverflow) ? state.infOverflow : 0;
      if (extra > 0) return '∞+' + fmt(extra);
      return '∞';
    }
    // 处理非数字/非有限数
    if (!isFinite(v) || isNaN(v)) return '0';
    // 完整数字模式
    if (typeof state !== 'undefined' && state && state.useFullNumbers) {
      try { return Math.floor(v).toLocaleString('en-US'); } catch(_) { return String(Math.floor(v)); }
    }
    // 数值格式化（科学计数法）
    const abs = Math.abs(v);
    const sign = v < 0 ? '-' : '';
    if (abs < 10000) return sign + Math.floor(abs).toString();
    if (abs < 1e8) return sign + (abs/1e4).toFixed(2) + '万';
    if (abs < 1e12) return sign + (abs/1e8).toFixed(2) + '亿';
    if (abs < 1e16) return sign + (abs/1e12).toFixed(2) + '万亿';
    if (abs < 1e20) return sign + (abs/1e16).toFixed(2) + '京';
    if (abs < 1e24) return sign + (abs/1e20).toFixed(2) + '垓';
    if (abs < 1e28) return sign + (abs/1e24).toFixed(2) + '秭';
    if (abs < 1e32) return sign + (abs/1e28).toFixed(2) + '穰';
    if (abs < 1e36) return sign + (abs/1e32).toFixed(2) + '沟';
    if (abs < 1e40) return sign + (abs/1e36).toFixed(2) + '涧';
    if (abs < 1e44) return sign + (abs/1e40).toFixed(2) + '正';
    if (abs < 1e48) return sign + (abs/1e44).toFixed(2) + '载';
    if (abs < 1e52) return sign + (abs/1e48).toFixed(2) + '极';
    if (abs < 1e56) return sign + (abs/1e52).toFixed(2) + '恒河沙';
    if (abs < 1e60) return sign + (abs/1e56).toFixed(2) + '阿僧祇';
    if (abs < 1e64) return sign + (abs/1e60).toFixed(2) + '那由他';
    if (abs < 1e68) return sign + (abs/1e64).toFixed(2) + '不可思议';
    if (abs < 1e72) return sign + (abs/1e68).toFixed(2) + '无量';
    if (abs < 1e76) return sign + (abs/1e72).toFixed(2) + '大数';
    if (abs === Infinity) return '∞';
    const e = Math.floor(Math.log10(abs));
    const mnt = abs / Math.pow(10, e);
    return sign + mnt.toFixed(2) + 'e' + e;
  } catch(e) {
    // 兜底：任何未预期的异常都返回 '0'，防止 Firebase WARNING 崩溃
    console.warn('fmt error:', e, 'input:', v);
    return '0';
  }
}
function escapeHtml(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }
function errShow(msg) { document.getElementById('gateErr').innerText = msg; }

function boot() {
  const btn = document.getElementById('gateBtn'); const input = document.getElementById('pwdInput');
  if (!btn || !input) return;
  btn.onclick = () => { if (input.value === AUTHOR_PWD) { localStorage.setItem(AUTH_KEY, 'ok'); enterAdmin(); } else errShow('密钥错误'); };
  if (localStorage.getItem(AUTH_KEY) === 'ok') enterAdmin();
}

function enterAdmin() {
  document.getElementById('gateScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  if (!db) { const app2 = initializeApp(firebaseConfig); db = getDatabase(app2); }
  onValue(ref(db, 'game_players'), (snap) => {
    allPlayers = snap.exists() ? snap.val() : {};
    renderPlayerList();
    if (selectedPlayer && allPlayers[selectedPlayer]) renderPlayerDetail(selectedPlayer, allPlayers[selectedPlayer]);
  });
}

let pressTimer = null;
function renderPlayerList() {
  const el = document.getElementById('playerList'); el.innerHTML = '';
  const ids = Object.keys(allPlayers);
  if (ids.length === 0) { el.innerHTML = '<div style="color:#666;text-align:center;padding:20px;font-size:12px;">暂无玩家</div>'; return; }
  ids.sort((a,b) => safeNum(allPlayers[b].lastActive,0) - safeNum(allPlayers[a].lastActive,0));
  ids.forEach(id => {
    const p = allPlayers[id]; const div = document.createElement('div'); div.className = 'player-item';
    if (id === selectedPlayer) div.style.background = 'rgba(255,215,0,0.15)';
    const wIdx = p.currentWorldIdx !== undefined ? p.currentWorldIdx : 0;
    div.innerHTML = `<div style="font-weight:bold;color:#fff;font-size:13px;">${escapeHtml(p.name||'无名')}</div>
      <div style="font-size:11px;color:#888;margin-top:3px;">${REALM_NAMES[safeNum(p.realm,0)]||'炼气'} ${safeNum(p.realmLevel,1)}层 · Lv.${fmt(p.charLevel)}</div>
      <div style="font-size:10px;color:#666;">${WORLD_NAMES[wIdx]||'凡界'} · 💎${fmt(p.jade)} 🍑${fmt(p.peaches)}</div>`;
    div.onclick = () => { selectedPlayer = id; renderPlayerList(); renderPlayerDetail(id, p); };
    div.oncontextmenu = (e) => { e.preventDefault(); return false; };
    div.addEventListener('touchstart', () => {
      pressTimer = setTimeout(() => {
        if(confirm(`☢️ 确定彻底抹除玩家【${p.name}】全部数据？不可逆！`)) destroyPlayerAccount(id, p.name);
      }, 800);
    });
    div.addEventListener('touchend', () => clearTimeout(pressTimer));
    div.addEventListener('touchmove', () => clearTimeout(pressTimer));
    el.appendChild(div);
  });
}

window.destroyPlayerAccount = function(id, name) {
  remove(ref(db, 'game_players/' + id)).then(() => {
    get(ref(db, 'game_accounts')).then(snap => {
      if(snap.exists()){
        const accs = snap.val();
        for(let key in accs){
          if(accs[key].playerId === id || key === name) remove(ref(db, 'game_accounts/' + key));
        }
      }
    });
    remove(ref(db, 'game_config/banned_players/' + id));
    if(selectedPlayer === id) { selectedPlayer = null; document.getElementById('playerDetail').innerHTML = ''; }
    alert(`✅ 玩家【${name}】数据已销毁。`);
  });
};

window.viewPlayerPassword = async function(id) {
  const pName = allPlayers[id].name;
  if (!pName) return alert('名字为空');
  try {
    const snap = await get(ref(db, 'game_accounts/' + pName));
    if (snap.exists() && snap.val().password) {
      let raw = snap.val().password, decoded = raw;
      try { decoded = atob(raw); } catch(e) {}
      alert(`玩家【${pName}】密码：\n${decoded}\n(库内: ${raw})`);
    } else alert('未找到密码数据');
  } catch (err) { alert('失败：' + err.message); }
};

window.confirmSendMail = async function(targetId) {
  const title = document.getElementById('mail_title').value || '系统邮件';
  const content = document.getElementById('mail_content').value || '请查收附件。';
  let attachments = {};

  const jade = parseBigNum(document.getElementById('mail_jade').value, 0); if (jade > 0) attachments.jade = jade;
  const peaches = parseBigNum(document.getElementById('mail_peaches').value, 0); if (peaches > 0) attachments.peaches = peaches;
  const exp = parseBigNum(document.getElementById('mail_exp').value, 0); if (exp > 0) attachments.exp = exp;
  const talent = parseBigNum(document.getElementById('mail_talentPoints').value, 0); if (talent > 0) attachments.talentPoints = talent;
  const sectPoints = parseBigNum(document.getElementById('mail_sectPoints').value, 0); if (sectPoints > 0) attachments.sectPoints = sectPoints;
  const ascPill = parseBigNum(document.getElementById('mail_ascensionPill').value, 0); if (ascPill > 0) attachments.ascensionPill = ascPill;

  const pillType = parseInt(document.getElementById('mail_pill_name').value);
  const pillCount = parseBigNum(document.getElementById('mail_pill_count').value, 1);
  const pillQuality = parseInt(document.getElementById('mail_pill_quality').value) || 0;
  if (pillType >= 0 && pillCount > 0) attachments.pill = { type: pillType, quality: pillQuality, count: pillCount };

  const pet = parseBigNum(document.getElementById('mail_pet').value, 0); if (pet > 0) attachments.pet = pet;
  const spirit = parseBigNum(document.getElementById('mail_spirit').value, 0); if (spirit > 0) attachments.spirit = spirit;

  const mountIdx = parseInt(document.getElementById('mail_mount').value);
  const mountCount = parseBigNum(document.getElementById('mail_mount_count').value, 1);
  if (mountIdx >= 0 && mountCount > 0) attachments.mount = { index: mountIdx, count: mountCount };

  const equipQuality = parseInt(document.getElementById('mail_equip_quality').value);
  const equipCount = parseBigNum(document.getElementById('mail_equip_count').value, 1);
  if (equipQuality >= 0 && equipCount > 0) attachments.equipment = { quality: equipQuality, count: equipCount };

  const herbQuality = parseInt(document.getElementById('mail_herb_quality').value);
  const herbYears = parseBigNum(document.getElementById('mail_herb_years').value, 100);
  const herbIntel = parseInt(document.getElementById('mail_herb_intel').value);
  const herbCount = parseBigNum(document.getElementById('mail_herb_count').value, 1);
  if (herbQuality >= 0 && herbCount > 0) {
    attachments.herbItems = { quality: herbQuality, years: herbYears, hasIntel: herbIntel === 1, count: herbCount };
  }

  const specialId = document.getElementById('mail_special_id').value;
  const specialCount = parseBigNum(document.getElementById('mail_special_count').value, 1);
  if (specialId && specialCount > 0) attachments.specialItem = { id: specialId, count: specialCount };

  const kn = parseBigNum(document.getElementById('mail_key_normal').value, 0);
  const kg = parseBigNum(document.getElementById('mail_key_gold').value, 0);
  const kc = parseBigNum(document.getElementById('mail_key_chaos').value, 0);
  if (kn > 0 || kg > 0 || kc > 0) attachments.keys = { normal: kn, gold: kg, chaos: kc };

  const ticketKey = document.getElementById('mail_ticket_key').value;
  const ticketCount = parseBigNum(document.getElementById('mail_ticket_count').value, 0);
  if (ticketKey && ticketCount > 0) attachments.tickets = { [ticketKey]: ticketCount };

  if (Object.keys(attachments).length === 0) return alert("请至少填写一种附件！");

  let mailCountStr = prompt("发送几封？", "1");
  if (mailCountStr === null) return;
  let mailCount = parseInt(mailCountStr);
  if (isNaN(mailCount) || mailCount <= 0) return alert("请输入有效数字");
  if (mailCount > 50 && !confirm(`将发送 ${mailCount} 封，确定？`)) return;

  const mailData = { title, content, attachments, time: Date.now(), claimed: false };

  if (targetId === 'all') {
    if (!confirm(`全服群发 ${mailCount} 封？`)) return;
    const snap = await get(ref(db, 'game_players'));
    if (snap.exists()) {
      const players = snap.val();
      let n = 0;
      for (let pid in players) {
        for (let i = 0; i < mailCount; i++) {
          push(ref(db, `game_players/${pid}/mail`), { ...mailData, time: Date.now() + i });
        }
        n++;
      }
      alert(`✅ 全服完成：${n} 人 × ${mailCount} 封`);
    }
  } else {
    for (let i = 0; i < mailCount; i++) {
      push(ref(db, `game_players/${targetId}/mail`), { ...mailData, time: Date.now() + i });
    }
    alert(`✅ 已发送 ${mailCount} 封`);
  }
  document.getElementById('selectModal').style.display = 'none';
};

window.createGiftPack = async function() {
  const name = prompt("礼包名称：", "特惠大礼包");
  if (!name) return;
  let items = [];
  while (true) {
    const type = prompt("添加：1仙桃 2仙玉 3装备 4经验 5结束", "1");
    if (type === '5' || type === null) break;
    let itemData = {};
    if (type === '1') { itemData = { type:'peaches', amount: parseBigNum(prompt("数量:","10000"),0) }; }
    else if (type === '2') { itemData = { type:'jade', amount: parseBigNum(prompt("数量:","100"),0) }; }
    else if (type === '3') {
      const part = prompt("部位:", "weapon");
      const q = parseInt(prompt("品质0-106:", "10")) || 0;
      itemData = { type:'equipment', eq: { id:'EQ-GIFT-'+Date.now(), part, quality:q, atk:1000*(q+1), hp:2000*(q+1), critRate:0.05, critDmg:0.5, enhance:0 } };
    }
    else if (type === '4') { itemData = { type:'exp', amount: parseBigNum(prompt("经验:","100000"),0) }; }
    else continue;
    items.push(itemData);
  }
  if (!items.length) return alert("无物品");
  const priceStr = prompt("价格：如 10t=10仙玉，500d=500仙桃", "10t");
  if (!priceStr) return;
  let cost = 0, currency = 'jade';
  if (priceStr.endsWith('t')) { cost = parseFloat(priceStr.slice(0,-1)); currency = 'jade'; }
  else if (priceStr.endsWith('d')) { cost = parseFloat(priceStr.slice(0,-1)); currency = 'peaches'; }
  else return alert("格式需以 t 或 d 结尾");
  push(ref(db, 'game_gifts'), { name, items, cost, currency, createdAt: Date.now() }).then(() => alert("✅ 已发布"));
};

// ===== 解析礼包内容字符串 =====
// 返回结构化数据，支持多特殊道具 / 多坐骑（会拆成多封邮件）
function parsePackContent(contentStr) {
  const result = {
    jade: 0,
    peaches: 0,
    keys: { normal: 0, gold: 0, chaos: 0 },
    specials: [],   // [{id, count}, ...]
    mounts: []      // [index, index, ...]
  };
  if (!contentStr) return result;

  contentStr.split(',').forEach(item => {
    const parts = item.trim().split(':');
    if (parts.length < 2) return;
    const id = parts[0].trim();
    const count = parseInt(parts[1]) || 1;

    if (id === 'peaches') {
      result.peaches += count;
    } else if (id === 'jade') {
      result.jade += count;
    } else if (id === 'mount') {
      // mount:0 表示坐骑索引 0
      const idx = parseInt(parts[1]);
      if (!isNaN(idx) && idx >= 0) result.mounts.push(idx);
    } else if (id === 'key_normal') {
      result.keys.normal += count;
    } else if (id === 'key_gold') {
      result.keys.gold += count;
    } else if (id === 'key_chaos') {
      result.keys.chaos += count;
    } else if (SPECIAL_ITEM_DEFS[id] || id.startsWith('chest_') || id.startsWith('buff_') ||
               id === 'ticket_pack' || id === 'material_box' || id === 'pet_egg' || id === 'spirit_bottle') {
      result.specials.push({ id, count });
    }
  });
  return result;
}

// ===== 通过邮件发放氪金礼包 =====
window.sendCashPack = async function(targetId) {
  const packKeys = Object.keys(CASH_PACKS);
  const items = packKeys.map(k => ({
    label: CASH_PACKS[k].name + ' - ' + (CASH_PACKS[k].price > 0 ? CASH_PACKS[k].price + '元' : '免费'),
    value: k
  }));

  if (items.length === 0) {
    alert('当前没有可用的氪金礼包定义');
    return;
  }

  document.getElementById('selectModalTitle').innerText = '选择氪金礼包发放';
  const el = document.getElementById('selectModalContent');
  el.innerHTML = '';

  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'list-item';
    div.innerHTML = '<span>' + item.label + '</span>';
    div.onclick = async () => {
      const packId = item.value;
      const pack = CASH_PACKS[packId];
      const parsed = parsePackContent(pack.content);

      let targetName = '全服玩家';
      if (targetId !== 'all' && allPlayers[targetId]) {
        targetName = allPlayers[targetId].name;
      }

      const contentPreview = pack.content.replace(/,/g, '\n');
      if (!confirm('确认向 ' + targetName + ' 发放【' + pack.name + '】？\n\n奖励内容：\n' + contentPreview)) {
        return;
      }

      let mailCountStr = prompt('发送几封？', '1');
      if (mailCountStr === null) return;
      let mailCount = parseInt(mailCountStr);
      if (isNaN(mailCount) || mailCount <= 0) return alert('请输入有效数字');

      // 把解析结果转成一封或多封标准 attachments
      // 规则：资源 + 钥匙 放第一封；每个 special / 每个 mount 单独一封（兼容现有客户端领取逻辑）
      const baseAtt = {};
      if (parsed.jade > 0) baseAtt.jade = parsed.jade;
      if (parsed.peaches > 0) baseAtt.peaches = parsed.peaches;
      if (parsed.keys.normal > 0 || parsed.keys.gold > 0 || parsed.keys.chaos > 0) {
        baseAtt.keys = { ...parsed.keys };
      }

      const mailList = [];
      // 第一封：带资源 + 第一个特殊道具（如果有）
      let firstAtt = { ...baseAtt };
      if (parsed.specials.length > 0) {
        firstAtt.specialItem = parsed.specials[0];
      }
      if (Object.keys(firstAtt).length > 0) {
        mailList.push(firstAtt);
      }
      // 剩余特殊道具
      for (let i = 1; i < parsed.specials.length; i++) {
        mailList.push({ specialItem: parsed.specials[i] });
      }
      // 每个坐骑单独一封
      parsed.mounts.forEach(idx => {
        mailList.push({ mount: { index: idx, count: 1 } });
      });

      // 如果完全没有内容（极端情况）
      if (mailList.length === 0) {
        alert('礼包内容解析为空，无法发送');
        return;
      }

      const sendToPlayer = async (pid) => {
        for (let m = 0; m < mailCount; m++) {
          for (let a = 0; a < mailList.length; a++) {
            const mailData = {
              title: '氪金礼包：' + pack.name + (mailList.length > 1 ? ` (${a + 1}/${mailList.length})` : ''),
              content: '恭喜获得【' + pack.name + '】，请查收附件！',
              attachments: mailList[a],
              time: Date.now() + m * 100 + a,
              claimed: false
            };
            await push(ref(db, 'game_players/' + pid + '/mail'), mailData);
          }
        }
      };

      if (targetId === 'all') {
        if (!confirm('全服群发 ' + mailCount + ' 套【' + pack.name + '】？')) return;
        const snap = await get(ref(db, 'game_players'));
        if (snap.exists()) {
          const players = snap.val();
          let n = 0;
          for (let pid in players) {
            await sendToPlayer(pid);
            n++;
          }
          alert('全服完成：' + n + ' 人 × ' + mailCount + ' 套【' + pack.name + '】（共 ' + (mailList.length * mailCount) + ' 封邮件）');
        }
      } else {
        await sendToPlayer(targetId);
        alert('已向 ' + targetName + ' 发送 ' + mailCount + ' 套【' + pack.name + '】（共 ' + (mailList.length * mailCount) + ' 封邮件）');
      }

      document.getElementById('selectModal').style.display = 'none';
      if (selectedPlayer === targetId && allPlayers[targetId]) {
        renderPlayerDetail(targetId, allPlayers[targetId]);
      }
    };
    el.appendChild(div);
  });

  document.getElementById('selectModal').style.display = 'flex';
};

  if (v === null) return;
  const newEq = { ...allPlayers[id].inventory[idx], enhance: v };
  set(ref(db, 'game_players/'+id+'/inventory/'+idx), newEq).then(() => alert('已改'));
};
window.setInvEquipStats = function(id, idx) {
  const eq = allPlayers[id].inventory[idx];
  document.getElementById('selectModalTitle').innerText = "改背包装备";
  document.getElementById('selectModalContent').innerHTML = `
    <div class="field"><label>攻击</label><input id="m_atk" type="text" placeholder="${eq.atk}"></div>
    <div class="field"><label>气血</label><input id="m_hp" type="text" placeholder="${eq.hp}"></div>
    <div class="field"><label>品质</label><input id="m_q" type="number" placeholder="${eq.quality}"></div>
    <button class="btn btn-green" onclick="confirmInvEquipStats('${id}',${idx})">确认</button>`;
  document.getElementById('selectModal').style.display = 'flex';
};
window.confirmInvEquipStats = function(id, idx) {
  const eq = allPlayers[id].inventory[idx];
  const a = parseBigNum(document.getElementById('m_atk').value, eq.atk);
  const h = parseBigNum(document.getElementById('m_hp').value, eq.hp);
  const q = parseInt(document.getElementById('m_q').value);
  set(ref(db, 'game_players/'+id+'/inventory/'+idx), { ...eq, atk:a, hp:h, quality: isNaN(q)?eq.quality:q }).then(() => {
    document.getElementById('selectModal').style.display = 'none'; alert('已改');
  });
};
window.deleteInvEquip = (id, idx) => {
  if (confirm('删除这件装备？')) remove(ref(db, 'game_players/'+id+'/inventory/'+idx));
};
window.setSpellLevel = (id, spellId) => {
  const v = parseBigNum(prompt('等级:', '1'), null);
  if (v !== null) update(ref(db, 'game_players/'+id+'/spells/'+spellId), { level: v });
};
window.speedupSpell = (id, spellId) => update(ref(db, 'game_players/'+id+'/spells/'+spellId), { upgradeEnd: 0 });
window.speedupTree = (id) => update(ref(db, 'game_players/'+id), { treeUpgradeEnd: Date.now() - 1000 });
window.banPlayer = (id) => {
  const reason = prompt('原因:', '违规');
  if (reason) set(ref(db, 'game_config/banned_players/'+id), { reason, time: Date.now() }).then(() => alert('已封禁'));
};
window.unbanPlayer = (id) => remove(ref(db, 'game_config/banned_players/'+id)).then(() => alert('已解封'));
window.deletePlayer = (id) => {
  if (confirm('删除存档？')) remove(ref(db, 'game_players/'+id)).then(() => {
    selectedPlayer = null; document.getElementById('playerDetail').innerHTML = ''; alert('已删');
  });
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
</body>
</html>
